<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JJ 시계">
<meta name="application-name" content="JJ WORKS 탁상시계">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#05070a">
<title>JJ WORKS · 탁상시계</title>
<style>
  * { -webkit-box-sizing: border-box; box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: #05070a;
  }
  html {
    -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body {
    overflow: hidden;
    /* iOS 12 = SF(-apple-system). 리눅스 검증 환경용 대체글꼴을 앞세워 미리보기도 SF에 가깝게 */
    font-family: "Liberation Sans", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Helvetica, Arial, "Noto Sans CJK KR", sans-serif;
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    touch-action: manipulation;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    overflow: hidden;
    -webkit-transition: background-color .5s ease, color .5s ease;
    transition: background-color .5s ease, color .5s ease;
  }

  .stage {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    /* 하단 컨트롤 바가 떠도 카드가 가려지지 않도록 아래 여백을 미리 확보 */
    padding: 16px 0 96px 0;
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center;
    overflow: hidden;
  }

  .cards {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center;
    white-space: nowrap;
  }

  /* ── 플립 카드 ── */
  .card {
    position: relative;
    width: 300px; height: 375px;
    border-radius: 40px;
    overflow: hidden;
  }
  .cap {
    position: absolute; left: 0; right: 0; top: 34px;
    text-align: center; white-space: nowrap;
    font-size: 18px; line-height: 1.1; font-weight: 600;
    letter-spacing: .02em;
    z-index: 4;
  }
  .digits {
    position: absolute; left: 0; right: 0; top: 50%;
    text-align: center; white-space: nowrap;
    -webkit-transform: translateY(-50%); transform: translateY(-50%);
    z-index: 2;
  }
  .num {
    display: inline-block;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    -webkit-transform-origin: 50% 50%; transform-origin: 50% 50%;
  }
  .corner {
    position: absolute; bottom: 36px;
    font-size: 22px; line-height: 1; font-weight: 700;
    letter-spacing: .02em;
    z-index: 4;
    font-variant-numeric: tabular-nums;
  }
  .corner-left { left: 34px; }
  .corner-right { right: 34px; }

  /* 카드 중앙 힌지선 + 상하 입체 음영 */
  .hinge {
    position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; z-index: 1;
    pointer-events: none;
  }
  .shade-top, .shade-bot {
    position: absolute; left: 0; right: 0; height: 50%;
    z-index: 1; pointer-events: none;
  }
  .shade-top { top: 0; }
  .shade-bot { bottom: 0; }

  /* 숫자가 바뀔 때의 짧은 플립 펄스 */
  @-webkit-keyframes cardTick {
    0%   { -webkit-transform: perspective(760px) rotateX(0deg); }
    45%  { -webkit-transform: perspective(760px) rotateX(-9deg); }
    100% { -webkit-transform: perspective(760px) rotateX(0deg); }
  }
  @keyframes cardTick {
    0%   { transform: perspective(760px) rotateX(0deg); }
    45%  { transform: perspective(760px) rotateX(-9deg); }
    100% { transform: perspective(760px) rotateX(0deg); }
  }
  .card.tick .num {
    -webkit-animation: cardTick .42s ease-out 1;
    animation: cardTick .42s ease-out 1;
  }

  /* ── 하단 컨트롤 바 ── */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 30;
    padding: 30px 14px 16px 14px;
    opacity: 1;
    -webkit-transform: translateY(0); transform: translateY(0);
    -webkit-transition: opacity .45s ease, -webkit-transform .45s ease;
    transition: opacity .45s ease, transform .45s ease;
  }
  .bar.hidden {
    opacity: 0;
    -webkit-transform: translateY(110%); transform: translateY(110%);
    pointer-events: none;
  }
  .bar-inner {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -ms-flex-wrap: wrap; flex-wrap: wrap;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center;
  }
  .group {
    display: -webkit-box; display: -ms-flexbox; display: flex;
    -webkit-box-align: center; -ms-flex-align: center; align-items: center;
    margin: 0 7px;
  }
  .brand {
    font-size: 10px; line-height: 1; font-weight: 700;
    letter-spacing: .3em; text-transform: uppercase;
    margin: 0 12px 0 2px; opacity: .5;
  }
  .btn {
    font-family: inherit; font-size: 12px; line-height: 1; font-weight: 600;
    letter-spacing: .02em;
    padding: 9px 13px; margin: 4px 3px;
    background-color: transparent; background-image: none;
    border-radius: 999px; border-width: 1px; border-style: solid;
    -webkit-appearance: none; appearance: none;
    cursor: pointer;
    -webkit-transition: opacity .2s ease, border-color .2s ease, color .2s ease;
    transition: opacity .2s ease, border-color .2s ease, color .2s ease;
  }
  .btn:active { opacity: .62; }

  /* ── 야간 디밍 오버레이 ── */
  .dimmer {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    z-index: 40;
    background-color: #000000;
    opacity: 0; pointer-events: none;
    -webkit-transition: opacity .9s ease; transition: opacity .9s ease;
  }
  .dim .dimmer { opacity: .62; }

  /* ── 다크 테마 ── */
  [data-theme="dark"] .app {
    background-color: #05070a;
    background-image: -webkit-radial-gradient(50% 42%, 150% 130%, #121a24 0%, #080c11 56%, #030507 100%);
    background-image: radial-gradient(120% 100% at 50% 42%, #121a24 0%, #080c11 56%, #030507 100%);
    color: #f4f7fb;
  }
  [data-theme="dark"] .card {
    background-color: #0d1115;
    background-image: -webkit-linear-gradient(top, #1a2129 0%, #121821 48%, #0d1218 52%, #080c10 100%);
    background-image: linear-gradient(to bottom, #1a2129 0%, #121821 48%, #0d1218 52%, #080c10 100%);
    border: 1px solid rgba(255, 255, 255, .06);
    box-shadow: 0 24px 46px rgba(0, 0, 0, .58), 0 2px 6px rgba(0, 0, 0, .42);
  }
  [data-theme="dark"] .num { color: #f6f8fb; }
  [data-theme="dark"] .cap { color: rgba(205, 219, 233, .62); }
  [data-theme="dark"] .corner { color: rgba(222, 232, 242, .58); }
  [data-theme="dark"] .hinge {
    background-color: rgba(0, 0, 0, .55);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .05);
  }
  [data-theme="dark"] .shade-top {
    background-image: -webkit-linear-gradient(top, rgba(255, 255, 255, .05) 0%, rgba(255, 255, 255, 0) 34%, rgba(0, 0, 0, 0) 88%, rgba(0, 0, 0, .08) 100%);
    background-image: linear-gradient(to bottom, rgba(255, 255, 255, .05) 0%, rgba(255, 255, 255, 0) 34%, rgba(0, 0, 0, 0) 88%, rgba(0, 0, 0, .08) 100%);
  }
  [data-theme="dark"] .shade-bot {
    background-image: -webkit-linear-gradient(top, rgba(0, 0, 0, .30) 0%, rgba(0, 0, 0, 0) 9%, rgba(255, 255, 255, .045) 11%, rgba(255, 255, 255, 0) 34%, rgba(0, 0, 0, .10) 100%);
    background-image: linear-gradient(to bottom, rgba(0, 0, 0, .30) 0%, rgba(0, 0, 0, 0) 9%, rgba(255, 255, 255, .045) 11%, rgba(255, 255, 255, 0) 34%, rgba(0, 0, 0, .10) 100%);
  }
  [data-theme="dark"] .bar {
    background-image: -webkit-linear-gradient(top, rgba(3, 5, 7, 0) 0%, rgba(3, 5, 7, .88) 52%, rgba(3, 5, 7, .97) 100%);
    background-image: linear-gradient(to bottom, rgba(3, 5, 7, 0) 0%, rgba(3, 5, 7, .88) 52%, rgba(3, 5, 7, .97) 100%);
  }
  [data-theme="dark"] .brand { color: rgba(226, 236, 246, .45); }
  [data-theme="dark"] .btn { color: rgba(226, 237, 248, .76); border-color: rgba(158, 178, 200, .36); }
  [data-theme="dark"] .btn.on { color: #ffc061; border-color: rgba(255, 179, 64, .72); }

  /* ── 라이트 테마 ── */
  [data-theme="light"] .app {
    background-color: #eef1f5;
    background-image: -webkit-radial-gradient(50% 38%, 150% 130%, #ffffff 0%, #eef1f5 58%, #dfe4ea 100%);
    background-image: radial-gradient(120% 100% at 50% 38%, #ffffff 0%, #eef1f5 58%, #dfe4ea 100%);
    color: #0e141a;
  }
  [data-theme="light"] .card {
    background-color: #f7f9fb;
    background-image: -webkit-linear-gradient(top, #ffffff 0%, #f6f9fc 48%, #eef3f8 52%, #e6ecf2 100%);
    background-image: linear-gradient(to bottom, #ffffff 0%, #f6f9fc 48%, #eef3f8 52%, #e6ecf2 100%);
    border: 1px solid rgba(16, 24, 32, .07);
    box-shadow: 0 20px 38px rgba(22, 34, 48, .16), 0 2px 5px rgba(22, 34, 48, .08);
  }
  [data-theme="light"] .num { color: #0f151b; }
  [data-theme="light"] .cap { color: rgba(22, 32, 42, .55); }
  [data-theme="light"] .corner { color: rgba(26, 36, 46, .52); }
  [data-theme="light"] .hinge {
    background-color: rgba(16, 24, 32, .22);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .95);
  }
  [data-theme="light"] .shade-top {
    background-image: -webkit-linear-gradient(top, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0) 80%, rgba(16, 24, 32, .05) 100%);
    background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0) 80%, rgba(16, 24, 32, .05) 100%);
  }
  [data-theme="light"] .shade-bot {
    background-image: -webkit-linear-gradient(top, rgba(16, 24, 32, .12) 0%, rgba(16, 24, 32, 0) 7%, rgba(255, 255, 255, .8) 9%, rgba(255, 255, 255, 0) 26%, rgba(16, 24, 32, .03) 100%);
    background-image: linear-gradient(to bottom, rgba(16, 24, 32, .12) 0%, rgba(16, 24, 32, 0) 7%, rgba(255, 255, 255, .8) 9%, rgba(255, 255, 255, 0) 26%, rgba(16, 24, 32, .03) 100%);
  }
  [data-theme="light"] .bar {
    background-image: -webkit-linear-gradient(top, rgba(238, 241, 245, 0) 0%, rgba(238, 241, 245, .90) 52%, rgba(232, 236, 241, .98) 100%);
    background-image: linear-gradient(to bottom, rgba(238, 241, 245, 0) 0%, rgba(238, 241, 245, .90) 52%, rgba(232, 236, 241, .98) 100%);
  }
  [data-theme="light"] .brand { color: rgba(20, 28, 36, .42); }
  [data-theme="light"] .btn { color: rgba(20, 28, 36, .72); border-color: rgba(46, 62, 80, .28); }
  [data-theme="light"] .btn.on { color: #9a5100; border-color: rgba(178, 96, 0, .62); }

  @media (max-width: 620px) {
    .stage { padding: 10px 0 86px 0; }
    .btn { font-size: 11px; padding: 8px 10px; }
    .group { margin: 0 4px; }
    .brand { display: none; }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <div class="stage" id="stage">
    <div class="cards" id="cards">

      <div class="card" id="cardH">
        <div class="cap" id="capDate">26. 11. 25.</div>
        <div class="digits"><span class="num" id="numH">16</span></div>
        <div class="shade-top"></div>
        <div class="shade-bot"></div>
        <div class="hinge"></div>
        <div class="corner corner-left" id="ampmEl">오후</div>
      </div>

      <div class="card" id="cardM">
        <div class="cap" id="capDow">수요일</div>
        <div class="digits"><span class="num" id="numM">32</span></div>
        <div class="shade-top"></div>
        <div class="shade-bot"></div>
        <div class="hinge"></div>
        <div class="corner corner-right" id="secEl">37</div>
      </div>

    </div>
  </div>

  <div class="bar" id="bar">
    <div class="bar-inner">
      <span class="brand">JJ WORKS</span>
      <span class="group">
        <button type="button" class="btn on" id="bModeClock" aria-label="시계 모드">시계</button>
        <button type="button" class="btn" id="bModePomo" aria-label="포모도로 모드">포모도로</button>
      </span>
      <span class="group" id="pomoCtrl">
        <button type="button" class="btn" id="bStart" aria-label="포모도로 시작 일시정지">시작</button>
        <button type="button" class="btn" id="bReset" aria-label="포모도로 리셋">리셋</button>
      </span>
      <span class="group">
        <button type="button" class="btn" id="bTheme" aria-label="다크 라이트 테마 전환">다크</button>
        <button type="button" class="btn" id="bHour" aria-label="24시간제와 12시간제 전환">24시간</button>
        <button type="button" class="btn" id="bSec" aria-label="초 표시 켜기 끄기">초 표시</button>
        <button type="button" class="btn" id="bDim" aria-label="야간 디밍 켜기 끄기">야간 디밍</button>
      </span>
    </div>
  </div>

  <div class="dimmer" id="dimmer"></div>

</div>

<script>
(function () {
  'use strict';

  var DAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
  var K_THEME = 'jjclock.theme';
  var K_HOUR = 'jjclock.hour24';
  var K_SEC = 'jjclock.sec';
  var K_DIM = 'jjclock.dim';

  var FOCUS_SEC = 25 * 60;
  var BREAK_SEC = 5 * 60;
  var AUTO_HIDE_MS = 3000;

  var htmlEl = document.documentElement;
  var appEl = document.getElementById('app');
  var stageEl = document.getElementById('stage');
  var barEl = document.getElementById('bar');
  var cardHEl = document.getElementById('cardH');
  var cardMEl = document.getElementById('cardM');
  var numHEl = document.getElementById('numH');
  var numMEl = document.getElementById('numM');
  var capDateEl = document.getElementById('capDate');
  var capDowEl = document.getElementById('capDow');
  var ampmEl = document.getElementById('ampmEl');
  var secEl = document.getElementById('secEl');
  var pomoCtrlEl = document.getElementById('pomoCtrl');
  var metaTheme = document.querySelector('meta[name="theme-color"]');

  var btnModeClock = document.getElementById('bModeClock');
  var btnModePomo = document.getElementById('bModePomo');
  var btnStart = document.getElementById('bStart');
  var btnReset = document.getElementById('bReset');
  var btnTheme = document.getElementById('bTheme');
  var btnHour = document.getElementById('bHour');
  var btnSec = document.getElementById('bSec');
  var btnDim = document.getElementById('bDim');

  var state = { theme: 'dark', hour24: true, sec: true, dim: false, mode: 'clock' };
  var pomo = { running: false, remain: FOCUS_SEC, phase: 'focus', endAt: 0 };

  var lastH = '';
  var lastM = '';
  var lastDateKey = '';
  var hideTimer = null;
  var fitTimer = null;
  var pulseTimers = {};

  /* ── 저장소 (사파리 사생활 보호 모드에서 예외가 날 수 있어 감싼다) ── */
  function lsGet(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }
  function lsSet(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (e) {
      /* 저장 실패해도 시계 동작에는 영향 없음 */
    }
  }

  function p2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function setText(el, txt) {
    if (el && el.textContent !== txt) {
      el.textContent = txt;
    }
  }

  function nowMs() {
    return (new Date()).getTime();
  }

  /* ── 숫자 갱신 + 바뀔 때 짧은 플립 펄스 ── */
  function pulse(card) {
    if (!card) {
      return;
    }
    var id = card.id;
    card.className = card.className.replace(/\s*tick/g, '');
    var force = card.offsetWidth; /* 리플로우 강제 */
    if (force < 0) {
      force = 0;
    }
    card.className = card.className + ' tick';
    if (pulseTimers[id]) {
      clearTimeout(pulseTimers[id]);
    }
    pulseTimers[id] = setTimeout(function () {
      card.className = card.className.replace(/\s*tick/g, '');
      pulseTimers[id] = null;
    }, 470);
  }

  function setNum(el, card, txt, animate) {
    if (el.textContent === txt) {
      return;
    }
    el.textContent = txt;
    if (animate) {
      pulse(card);
    }
  }

  function setOn(btn, on) {
    var c = ' ' + btn.className + ' ';
    c = c.replace(/ on /g, ' ');
    c = c.replace(/\s+/g, ' ');
    c = c.replace(/^ /, '');
    c = c.replace(/ $/, '');
    if (on) {
      c = c + ' on';
    }
    btn.className = c;
  }

  /* ── 날짜·요일 ── */
  function updateDate(now) {
    var dkey = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
    if (dkey === lastDateKey) {
      return;
    }
    lastDateKey = dkey;
    setText(capDateEl, p2(now.getFullYear() % 100) + '. ' + p2(now.getMonth() + 1) + '. ' + p2(now.getDate()) + '.');
    setText(capDowEl, DAYS[now.getDay()]);
  }

  /* ── 시계 렌더 ── */
  function renderClock(now) {
    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();
    var hh = h;
    var label = '';

    if (!state.hour24) {
      hh = h % 12;
      if (hh === 0) {
        hh = 12;
      }
      label = (h < 12 ? '오전' : '오후');
      setText(ampmEl, label);
      ampmEl.style.display = 'block';
    } else {
      ampmEl.style.display = 'none';
    }

    var hs = p2(hh);
    var ms = p2(m);
    if (hs !== lastH) {
      lastH = hs;
      setNum(numHEl, cardHEl, hs, true);
    }
    if (ms !== lastM) {
      lastM = ms;
      setNum(numMEl, cardMEl, ms, true);
    }

    if (state.sec) {
      setText(secEl, p2(s));
      secEl.style.display = 'block';
    } else {
      secEl.style.display = 'none';
    }

    updateDate(now);
  }

  /* ── 포모도로 ── */
  function phaseLength() {
    return pomo.phase === 'focus' ? FOCUS_SEC : BREAK_SEC;
  }

  function renderPomo() {
    var mm = Math.floor(pomo.remain / 60);
    var ss = pomo.remain % 60;
    setNum(numHEl, cardHEl, p2(mm), false);
    setNum(numMEl, cardMEl, p2(ss), false);
    setText(secEl, pomo.phase === 'focus' ? '집중' : '휴식');
    secEl.style.display = 'block';
    ampmEl.style.display = 'none';
    updateDate(new Date());
  }

  function finishPhase() {
    pomo.running = false;
    if (pomo.phase === 'focus') {
      pomo.phase = 'break';
    } else {
      pomo.phase = 'focus';
    }
    pomo.remain = phaseLength();
    pomo.endAt = 0;
    updatePomoBtn();
    pulse(cardHEl);
    pulse(cardMEl);
    showBar();
  }

  function pomoTick() {
    if (pomo.running) {
      var left = Math.ceil((pomo.endAt - nowMs()) / 1000);
      if (left < 0) {
        left = 0;
      }
      pomo.remain = left;
      renderPomo();
      if (left === 0) {
        finishPhase();
        renderPomo();
      }
      return;
    }
    renderPomo();
  }

  function updatePomoBtn() {
    setText(btnStart, pomo.running ? '일시정지' : '시작');
    setOn(btnStart, pomo.running);
  }

  function startPause() {
    if (state.mode !== 'pomo') {
      return;
    }
    if (pomo.running) {
      var left = Math.round((pomo.endAt - nowMs()) / 1000);
      if (left < 0) {
        left = 0;
      }
      pomo.remain = left;
      pomo.running = false;
    } else {
      if (pomo.remain <= 0) {
        pomo.remain = phaseLength();
      }
      pomo.endAt = nowMs() + pomo.remain * 1000;
      pomo.running = true;
    }
    updatePomoBtn();
    renderPomo();
  }

  function resetPomo() {
    pomo.running = false;
    pomo.remain = phaseLength();
    pomo.endAt = 0;
    updatePomoBtn();
    renderPomo();
  }

  function setMode(mode) {
    state.mode = mode;
    if (mode === 'pomo') {
      pomo.running = false;
      pomo.phase = 'focus';
      pomo.remain = FOCUS_SEC;
      pomo.endAt = 0;
      updatePomoBtn();
    } else {
      lastH = '';
      lastM = '';
    }
    updateModeUI();
    render();
  }

  function updateModeUI() {
    var isPomo = (state.mode === 'pomo');
    setOn(btnModeClock, !isPomo);
    setOn(btnModePomo, isPomo);
    pomoCtrlEl.style.display = isPomo ? '' : 'none';
  }

  /* ── 테마·형식·디밍 ── */
  function applyTheme() {
    htmlEl.setAttribute('data-theme', state.theme);
    setText(btnTheme, state.theme === 'dark' ? '다크' : '라이트');
    if (metaTheme) {
      metaTheme.setAttribute('content', state.theme === 'dark' ? '#05070a' : '#eef1f5');
    }
  }

  function applyFormat() {
    setText(btnHour, state.hour24 ? '24시간' : '12시간');
    setText(btnSec, state.sec ? '초 표시' : '초 숨김');
    lastH = '';
    lastM = '';
    render();
  }

  function applyDim() {
    if (state.dim) {
      appEl.className = appEl.className + ' dim';
    } else {
      appEl.className = appEl.className.replace(/\s*dim/g, '');
    }
    setOn(btnDim, state.dim);
  }

  function toggleTheme() {
    state.theme = (state.theme === 'dark') ? 'light' : 'dark';
    lsSet(K_THEME, state.theme);
    applyTheme();
  }

  function toggleHour() {
    state.hour24 = !state.hour24;
    lsSet(K_HOUR, state.hour24 ? '1' : '0');
    applyFormat();
  }

  function toggleSec() {
    state.sec = !state.sec;
    lsSet(K_SEC, state.sec ? '1' : '0');
    applyFormat();
  }

  function toggleDim() {
    state.dim = !state.dim;
    lsSet(K_DIM, state.dim ? '1' : '0');
    applyDim();
  }

  function loadState() {
    var t = lsGet(K_THEME);
    if (t === 'light' || t === 'dark') {
      state.theme = t;
    }
    var h = lsGet(K_HOUR);
    if (h === '0') {
      state.hour24 = false;
    } else if (h === '1') {
      state.hour24 = true;
    }
    var s = lsGet(K_SEC);
    if (s === '0') {
      state.sec = false;
    } else if (s === '1') {
      state.sec = true;
    }
    var d = lsGet(K_DIM);
    if (d === '0') {
      state.dim = false;
    } else if (d === '1') {
      state.dim = true;
    }
  }

  /* ── 3초 자동 숨김 ── */
  function showBar() {
    barEl.className = barEl.className.replace(/\s*hidden/g, '');
    if (hideTimer) {
      clearTimeout(hideTimer);
    }
    hideTimer = setTimeout(function () {
      hideTimer = null;
      if (barEl.className.indexOf('hidden') < 0) {
        barEl.className = barEl.className + ' hidden';
      }
    }, AUTO_HIDE_MS);
  }

  function onAnyInput() {
    showBar();
  }

  /* ── 화면 맞춤 (clamp() 미지원 대응: 직접 측정해서 px 지정) ── */
  function fit() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var padX = (vw < 560) ? 12 : 20;
    var stagePadTop = (vw < 620) ? 10 : 16;
    var stagePadBottom = (vw < 620) ? 86 : 96;
    var availW = vw - padX * 2;
    var availH = vh - stagePadTop - stagePadBottom;
    if (availW < 80) {
      availW = 80;
    }
    if (availH < 80) {
      availH = 80;
    }

    var AR = 0.80;       /* 카드 가로 / 세로 */
    var GAPR = 0.10;     /* 카드 사이 간격 / 카드 가로 */
    var cardH = availH * 0.97;
    var cardW = cardH * AR;
    if (cardW * (2 + GAPR) > availW) {
      cardW = availW / (2 + GAPR);
      cardH = cardW / AR;
    }
    cardW = Math.floor(cardW);
    cardH = Math.floor(cardH);
    var gap = Math.round(cardW * GAPR);
    if (gap < 8) {
      gap = 8;
    }

    var radius = Math.round(cardW * 0.115);
    cardHEl.style.width = cardW + 'px';
    cardHEl.style.height = cardH + 'px';
    cardHEl.style.borderRadius = radius + 'px';
    cardHEl.style.marginRight = gap + 'px';
    cardMEl.style.width = cardW + 'px';
    cardMEl.style.height = cardH + 'px';
    cardMEl.style.borderRadius = radius + 'px';

    var capFs = Math.round(cardW * 0.058);
    if (capFs < 10) {
      capFs = 10;
    }
    var cornerFs = Math.round(cardW * 0.072);
    if (cornerFs < 11) {
      cornerFs = 11;
    }
    var topPad = Math.round(cardH * 0.085);
    var botPad = Math.round(cardH * 0.09);
    var sidePad = Math.round(cardW * 0.085);

    capDateEl.style.fontSize = capFs + 'px';
    capDowEl.style.fontSize = capFs + 'px';
    capDateEl.style.top = topPad + 'px';
    capDowEl.style.top = topPad + 'px';
    ampmEl.style.fontSize = cornerFs + 'px';
    secEl.style.fontSize = cornerFs + 'px';
    ampmEl.style.bottom = botPad + 'px';
    secEl.style.bottom = botPad + 'px';
    ampmEl.style.left = sidePad + 'px';
    secEl.style.right = sidePad + 'px';

    /* 숫자: 100px로 재고 카드 폭·높이에 맞춰 축소 */
    var boxW = cardW * 0.86;
    var boxH = cardH * 0.60;
    numHEl.style.fontSize = '100px';
    numMEl.style.fontSize = '100px';
    var w1 = numHEl.getBoundingClientRect().width;
    var w2 = numMEl.getBoundingClientRect().width;
    if (!w1) {
      w1 = 118;
    }
    if (!w2) {
      w2 = 118;
    }
    var wMax = (w1 > w2) ? w1 : w2;
    var fs = boxW * 100 / wMax;
    if (fs > boxH) {
      fs = boxH;
    }
    fs = Math.floor(fs);
    if (fs < 24) {
      fs = 24;
    }
    numHEl.style.fontSize = fs + 'px';
    numMEl.style.fontSize = fs + 'px';
  }

  function scheduleFit() {
    if (fitTimer) {
      clearTimeout(fitTimer);
    }
    fitTimer = setTimeout(function () {
      fitTimer = null;
      fit();
    }, 120);
  }

  function render() {
    var now = new Date();
    if (state.mode === 'pomo') {
      renderPomo();
    } else {
      renderClock(now);
    }
  }

  function tick() {
    if (state.mode === 'pomo') {
      pomoTick();
    } else {
      renderClock(new Date());
    }
  }

  function onVisible() {
    render();
    fit();
  }

  function keepAwake() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        var req = navigator.wakeLock.request('screen');
        if (req && req['catch']) {
          req['catch'](function () {});
        }
      }
    } catch (e) {
      /* iOS 12에는 없음 */
    }
  }

  function bindBtn(btn, fn) {
    btn.onclick = function (e) {
      if (e && e.stopPropagation) {
        e.stopPropagation();
      }
      fn();
      showBar();
      return false;
    };
  }

  function init() {
    loadState();
    applyTheme();
    applyDim();
    applyFormat();
    updateModeUI();
    updatePomoBtn();

    bindBtn(btnModeClock, function () { setMode('clock'); });
    bindBtn(btnModePomo, function () { setMode('pomo'); });
    bindBtn(btnStart, startPause);
    bindBtn(btnReset, resetPomo);
    bindBtn(btnTheme, toggleTheme);
    bindBtn(btnHour, toggleHour);
    bindBtn(btnSec, toggleSec);
    bindBtn(btnDim, toggleDim);

    document.addEventListener('touchstart', onAnyInput, false);
    document.addEventListener('mousedown', onAnyInput, false);
    document.addEventListener('mousemove', onAnyInput, false);
    document.addEventListener('click', onAnyInput, false);
    document.addEventListener('keydown', onAnyInput, false);
    window.addEventListener('resize', scheduleFit, false);
    window.addEventListener('orientationchange', function () {
      setTimeout(fit, 350);
      setTimeout(fit, 900);
    }, false);
    document.addEventListener('visibilitychange', onVisible, false);
    window.addEventListener('focus', onVisible, false);

    render();
    fit();
    setTimeout(fit, 60);
    setTimeout(fit, 320);
    showBar();
    setInterval(tick, 250);
    keepAwake();
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    init();
  } else {
    document.addEventListener('DOMContentLoaded', init, false);
  }
})();
</script>

</body>
